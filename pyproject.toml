[project]
name = "chuk-mcp-vision"
version = "0.1.0"
description = "Generic computer vision MCP server with atomic, composable tools for image analysis"
authors = [
    {name = "Chris Hay", email = "chris@example.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chuk-mcp-server>=0.8",
    "chuk-artifacts>=0.9.1",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "paddleocr>=2.7.0",
    "pytesseract>=0.3.10",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "bandit>=1.7.0",
]

[project.scripts]
chuk-mcp-vision = "chuk_mcp_vision.server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["E402"]  # Allow imports after sys.path manipulation in examples
"examples/legacy/**/*.py" = ["E722", "F821", "F841"]  # Legacy code - ignore bare except, undefined names, and unused vars

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
no_implicit_optional = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "paddleocr.*",
    "pytesseract.*",
    "google.generativeai.*",
    "skimage.*",
    "cv2.*",
]
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = "chuk_mcp_vision.tools.*"
# Ignore @tool decorator type inference issues and numpy/cv2 type issues
disable_error_code = ["arg-type", "call-arg", "misc", "assignment", "union-attr", "return-value", "var-annotated", "call-overload", "index", "operator", "type-var", "attr-defined"]
